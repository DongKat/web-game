services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -w packages/server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CLIENT_ORIGIN=http://localhost:5173
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -w packages/client -- --host
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - server
    restart: unless-stopped
